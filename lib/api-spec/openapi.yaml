openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Oxymed Medikal API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Admin authentication
  - name: sliders
    description: Homepage sliders
  - name: products
    description: Products and categories
  - name: news
    description: News posts
  - name: references
    description: Reference projects
  - name: quotes
    description: Quote requests
  - name: corporate
    description: Corporate content sections
  - name: settings
    description: Site settings
  - name: media
    description: Media library and file uploads
  - name: catalogs
    description: Product catalogs
  - name: warranty
    description: Warranty and service management
  - name: production
    description: Production order management and BOM
  - name: service-reports
    description: Service report management
  - name: email-logs
    description: Email send history logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: adminMe
      tags: [auth]
      summary: Get current admin user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # SLIDERS
  /sliders:
    get:
      operationId: listSliders
      tags: [sliders]
      summary: List all sliders
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of sliders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slider"
    post:
      operationId: createSlider
      tags: [sliders]
      summary: Create slider
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SliderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slider"

  /sliders/{id}:
    get:
      operationId: getSlider
      tags: [sliders]
      summary: Get slider by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Slider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateSlider
      tags: [sliders]
      summary: Update slider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SliderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slider"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSlider
      tags: [sliders]
      summary: Delete slider
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # CATALOGS
  /catalogs:
    get:
      operationId: listCatalogs
      tags: [catalogs]
      summary: List catalogs
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: language
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of catalogs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Catalog"
    post:
      operationId: createCatalog
      tags: [catalogs]
      summary: Create catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"

  /catalogs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: getCatalog
      tags: [catalogs]
      summary: Get catalog by id
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
    patch:
      operationId: updateCatalog
      tags: [catalogs]
      summary: Update catalog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
    delete:
      operationId: deleteCatalog
      tags: [catalogs]
      summary: Delete catalog
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Deleted

  # PRODUCT CATEGORIES
  /product-categories:
    get:
      operationId: listProductCategories
      tags: [products]
      summary: List product categories
      responses:
        "200":
          description: List of product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductCategory"
    post:
      operationId: createProductCategory
      tags: [products]
      summary: Create product category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategory"

  /product-categories/{id}:
    patch:
      operationId: updateProductCategory
      tags: [products]
      summary: Update product category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategory"
    delete:
      operationId: deleteProductCategory
      tags: [products]
      summary: Delete product category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # PRODUCTS
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: published
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/by-slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Get product by page slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # NEWS
  /news:
    get:
      operationId: listNews
      tags: [news]
      summary: List news posts
      parameters:
        - name: slug
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: published
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of news
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsListResponse"
    post:
      operationId: createNews
      tags: [news]
      summary: Create news post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"

  /news/{id}:
    get:
      operationId: getNewsItem
      tags: [news]
      summary: Get news by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: News item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateNews
      tags: [news]
      summary: Update news post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsItem"
    delete:
      operationId: deleteNews
      tags: [news]
      summary: Delete news post
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # REFERENCES
  /references:
    get:
      operationId: listReferences
      tags: [references]
      summary: List reference projects
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: showInMarquee
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceListResponse"
    post:
      operationId: createReference
      tags: [references]
      summary: Create reference project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceItem"

  /references/{id}:
    patch:
      operationId: updateReference
      tags: [references]
      summary: Update reference project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferenceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferenceItem"
    delete:
      operationId: deleteReference
      tags: [references]
      summary: Delete reference project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # QUOTE REQUESTS
  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quote requests (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of quote requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteListResponse"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a quote request (public)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get quote request by id (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"
    patch:
      operationId: updateQuoteStatus
      tags: [quotes]
      summary: Update quote request status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"

  # CORPORATE
  /corporate:
    get:
      operationId: listCorporateSections
      tags: [corporate]
      summary: List all corporate sections
      responses:
        "200":
          description: Corporate sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorporateSection"

  /corporate/{sectionKey}:
    get:
      operationId: getCorporateSection
      tags: [corporate]
      summary: Get corporate section by key
      parameters:
        - name: sectionKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Corporate section
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateSection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertCorporateSection
      tags: [corporate]
      summary: Create or update corporate section
      security:
        - bearerAuth: []
      parameters:
        - name: sectionKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorporateSectionInput"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorporateSection"

  # SETTINGS
  /settings:
    get:
      operationId: listSettings
      tags: [settings]
      summary: Get all site settings
      responses:
        "200":
          description: Settings as key-value map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsMap"

  /settings/{settingKey}:
    put:
      operationId: upsertSetting
      tags: [settings]
      summary: Create or update a setting
      security:
        - bearerAuth: []
      parameters:
        - name: settingKey
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingInput"
      responses:
        "200":
          description: Setting upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"

  /settings/smtp/status:
    get:
      operationId: getSmtpStatus
      tags: [settings]
      summary: Get SMTP configuration status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SMTP configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpStatusResult"

  /settings/smtp/test:
    post:
      operationId: testSmtpConnection
      tags: [settings]
      summary: Send a test email to verify SMTP configuration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmtpTestInput"
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmtpTestResult"
        "400":
          description: Invalid request or SMTP not configured

  # MEDIA
  /media:
    get:
      operationId: listMediaFiles
      tags: [media]
      summary: List media files (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of media files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaListResponse"

  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a media file (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaUploadInput"
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaFile"

  /media/request-upload-url:
    post:
      operationId: requestMediaUploadUrl
      tags: [media]
      summary: Request presigned upload URL for a media file
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignedUrlInput"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"

  /media/{id}:
    delete:
      operationId: deleteMediaFile
      tags: [media]
      summary: Delete a media file
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # WARRANTY MANAGEMENT
  /warranty/devices:
    get:
      operationId: listWarrantyDevices
      tags: [warranty]
      summary: List warranty devices (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of warranty devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyDeviceListResult"
    post:
      operationId: createWarrantyDevice
      tags: [warranty]
      summary: Create warranty device (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarrantyDeviceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyDevice"

  /warranty/devices/by-serial/{serialNo}:
    get:
      operationId: getWarrantyDeviceBySerial
      tags: [warranty]
      summary: Get device by serial number (public)
      parameters:
        - name: serialNo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device public info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyDevicePublic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /warranty/devices/by-qr/{qrToken}:
    get:
      operationId: getWarrantyDeviceByQr
      tags: [warranty]
      summary: Get device by QR token (public)
      parameters:
        - name: qrToken
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device public info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarrantyDevicePublic"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /warranty/records/{recordId}:
    get:
      operationId: getServiceReport
      tags: [warranty]
      summary: Get full service record report by ID (public)
